name: Altın kaynak testi (tek seferlik)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/altin-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Truncgil tam yanıt
        run: |
          curl -sS -m 20 -A "Mozilla/5.0 hesaplarsin-bot" "https://finans.truncgil.com/v4/today.json" > _gen/altin_probe.json
          git config user.email noreply@anthropic.com; git config user.name "altin-probe"
          git add _gen/altin_probe.json; git commit -m "Altın kaynak testi 2 [skip ci]" && git push
