name: IndexNow (Bing, Yandex)
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
    inputs:
      tum:
        description: 'Sitemap içindeki tüm adresleri gönder'
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Değişen sayfaları IndexNow'a bildir
        env:
          KEY: 154a6c220204d14c07c1367d249c2474
          TUM: ${{ inputs.tum }}
        run: |
          if [ "$TUM" = "true" ]; then
            URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.html' | grep -v -E '^(_gen/|404\.html|blog-|kov-)' || true)
            URLS=$(for f in $FILES; do [ -f "$f" ] || continue; grep -q 'noindex' "$f" && continue; if [ "$f" = "index.html" ]; then echo "https://hesaplarsin.com/"; else echo "https://hesaplarsin.com/$f"; fi; done)
          fi
          [ -z "$URLS" ] && { echo "Bildirilecek sayfa yok"; exit 0; }
          echo "$URLS"
          sleep 120   # GitHub Pages yayınının tamamlanmasını bekle
          JSON=$(printf '%s\n' $URLS | python3 -c "import sys,json; u=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps({'host':'hesaplarsin.com','key':'$KEY','keyLocation':'https://hesaplarsin.com/$KEY.txt','urlList':u[:10000]}))")
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$JSON"
