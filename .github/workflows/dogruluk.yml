name: Doğruluk denetimi
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # her sabah 09:17 (TR): kontrol tarihi geçen veri varsa kırmızı yanar
  workflow_dispatch:
jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 _gen/dogrula.py
